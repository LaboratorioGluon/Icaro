name: icaro_app
description: Application to track and display Icaro's project data (see https://github.com/LaboratorioGluon/Icaro)

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # graphic:
  #   path: ./
  intl: ^0.20.2
  quiver: ^3.0.1+1
  provider: ^6.1.2
  async: ^2.12.0
  material_color_utilities: ^0.11.1
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  http: ^1.3.0
  flutter_map_animations: ^0.9.0
  based_battery_indicator: ^1.0.3
  syncfusion_flutter_gauges: ^28.2.12
  syncfusion_flutter_charts: ^28.2.12
  dart_mavlink: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.2
  leak_tracker: ^10.0.8
  vm_service: ^14.3.1
  
flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"